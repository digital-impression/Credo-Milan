# Publishes the site to GitHub Pages so there is a live preview URL.
#
# One-time setup by a repo admin: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that every push to a branch listed below
# redeploys https://digital-impression.github.io/Credo-Milan/
#
# Note: Pages on a private repository requires a paid GitHub plan. If the repo
# stays private on the free plan, make it public or use a different host.
name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - claude/credo-rehab-website-sotrtq
      - claude/credo-hero-section-n2blk0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true laat de action Pages zelf aanzetten met de
      # workflow-token, zodat een beheerder dat niet handmatig hoeft te doen.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is a static index.html plus assets/ — upload the repo as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
